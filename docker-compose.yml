version: "3.9"

services:
  db:
    platform: linux/x86_64
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: somewordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress

  wordpress:
    depends_on:
      - db
    # Supply an immutable image digest after verifying its PHP runtime (see README).
    # Official WordPress images checked on 2026-10-21 still contain unpatched PHP.
    image: "${COINBASE_WORDPRESS_IMAGE:?Set COINBASE_WORDPRESS_IMAGE to a verified patched WordPress image digest; see README}"
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/coinbase-commerce-woocommerce
    ports:
      - "8000:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress

volumes:
  db_data: {}
  wp_data: {}
